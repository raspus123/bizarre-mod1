buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.example.bizarremod'
archivesBaseName = 'bizarremod'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // Nomi MCP "snapshot": il codice della mod e' scritto con questi nomi
    mappings channel: 'snapshot', version: '20210309-1.16.5'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "bizarremod",
            "Specification-Vendor"    : "bizarremod",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : "bizarremod"
        ])
    }
}

// Rende il .jar utilizzabile nel gioco normale (non solo nell'ambiente di sviluppo)
jar.finalizedBy('reobfJar')
